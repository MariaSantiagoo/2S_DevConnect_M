<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width= device-width, initial-scale= 1.0">
    <meta name="author" content="Maria">
    <meta name="description" content="Site da empresa DevConnect">
    <title>Feed - DevConnect</title>

    <!--EMMET link:favcon-->
    <link rel="shortcut icon" href="../assets/images/logo-devconnect-sm.svg" type="image/x-icon">

    <!--EMMET link:css-->
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/perfil.css">

</head>

<body>

    <h1>Tela de perfil</h1>

    <!--Inicio header-->
    <header class="cabecalho">
        <nav>
            <a href="../pages/feed.html">
                <img id="logo-desktop" src="../assets/images/logo-devconnect-md1.svg" alt="Logo do DevConnect">
            </a>

            <a href="../pages/feed.html">
                <img id="logo-mobile" src="../assets/images/logo-devconnect-sm.svg" alt="Logo do DevConnect">
            </a>

            <div class="cabecalho-acoes">
                <a href="#">
                    <img src="../assets/images/icone-coracao-preto.svg" alt="">
                </a>
                <a href="./feed.html">
                    <img src="../assets/images/icone-casa-preto.svg" alt="">
                </a>
                <a href="#">
                    <img class="foto-perfil" src="../assets/images/My Melody _3.jpg" alt="">
                </a>
            </div>
        </nav>
    </header>
    <!--Fim header-->

    <main>
        <section class="tela">

            <section class="perfil">
                <img src="../assets/images/My Melody _3.jpg" alt="">

                <div id="nome-e-publicacao">
                    <h2>Marid1va</h2>
                    <span>1 publicação</span>
                    <p>Mari</p>
                </div>

                <div id="seguindo-editar-perfil">
                    <a href="#">128 seguindo</a>
                    <button type="button">Editar perfil</button>
                </div>

                <div id="seguidores-sair">
                    <a href="#">214 seguidores</a>
                    <button type="button">Sair</button>
                </div>

            </section>

            <section id="publicacoes-galeria">
                <img src="../assets/images/icone-galeria-preto.svg" alt="">
                <span>publicações</span>
            </section>


            <section class="publicacao">
                <article class="card-publi">

                    <header>
                        <a href="#">
                            <img class="foto-perfil" src="../assets/images/My Melody _3.jpg" alt="">
                            marid1va
                        </a>
                    </header>

                    <div class="descricao-publicacao">
                        <span>And I've been a forest fire</span>
                        <span>I am a forest fire</span>
                        <span>And I am the fire and I am the forest</span>
                        <span>And I am a witness watching it</span>
                    </div>

                    <div class="interacoes-publicacao">
                        <button type="button">
                            <img src="../assets/images/icone-coracao-preto.svg" alt="">
                        </button>

                        <button type="button">
                            <img src="../assets/images/icone-comentario-preto.svg" alt="">
                        </button>

                        <span>100k curtidas</span>
                    </div>

                    <button type="button">Ver todos os comentários...</button>

                </article>

            </section>

        </section>

    </main>


</body>
